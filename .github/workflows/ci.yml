name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Both platforms on purpose: a package-lock.json regenerated over an
      # existing node_modules tree records only that machine's native binaries
      # (esbuild/rollup/tailwind-oxide), so a lock made on macOS breaks Linux
      # installs and vice versa. Each runner catches the lock the other's
      # platform produced. macOS runs the install+build lock guard only;
      # the full test suite runs on ubuntu.
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # --ignore-scripts skips the root postinstall, a non-strict
      # `npm --prefix web install` followed by the web build. Run first, that
      # install would re-resolve platform packages missing from
      # web/package-lock.json (npm >= 11) and heal a broken lock on disk
      # before the strict step below could check it. The strict step does the
      # web build instead. No dependency in package-lock.json has an install
      # script of its own.
      - name: Install dependencies
        run: npm install --ignore-scripts

      # npm ci is the actual lockfile guard: `npm install` (npm >= 11)
      # silently re-resolves platform packages missing from the lock, so a
      # broken lock sails through it. npm ci never rewrites the lock, and with
      # a platform package missing it fails its own check ("Missing: ... from
      # lock file") before the build.
      - name: Build web assets (strict lockfile)
        run: npm run build:web:ci

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: npm test

  # The release as npm would pack it, installed on its own and run, as the
  # publish workflow checks before it publishes (see
  # scripts/pack-installs-alone.mjs): a change that leaves a file out of the
  # package, or imports what only devDependencies supply, fails before it
  # merges, not after a tag and its release notes are out. Its own job,
  # with contents: read only, since the install runs install scripts. That
  # install resolves dependencies from the registry as it stands, not from
  # this branch's lockfile, so a new upstream release can turn it red on a
  # change that touched nothing it installs: when it fails, rerunning it on
  # main tells a change's own break from the registry's drift.
  pack-check:
    name: Packed release installs on its own
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # bun runs the host.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Packed release installs on its own
        run: node scripts/pack-installs-alone.mjs

  # The README installs a checkout with `bun install`, from bun.lock; the
  # build job and the publish workflow install with npm, from
  # package-lock.json. This job keeps the stack's packages (@animalabs/*)
  # resolving the same way in both, so a checkout installed as the README
  # says runs the stack versions CI tested. Other packages may differ.
  lockfiles:
    name: Lockfiles agree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Frozen, bun refuses to install when package.json asks for anything
      # bun.lock doesn't pin. Install only: scripts off, and nothing is
      # tested on this tree.
      - name: bun.lock matches package.json
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Both lockfiles resolve the @animalabs packages the same way
        run: node scripts/lockfiles-agree.mjs
